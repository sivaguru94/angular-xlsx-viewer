<div class="app-container">
  <app-excel-viewer
    [url]="excelUrl"
    [config]="viewerConfig"
    [highlightedCells]="highlightedCells"
    (loaded)="onExcelLoaded($event)"
    (cellSelected)="onCellSelected($event)"
    (error)="onError($event)"
    (loadingChange)="onLoadingChange($event)"
  ></app-excel-viewer>
</div>
